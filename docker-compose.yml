services:
  mongo:
    image: mongo:7.0
    container_name: fleet_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=fleet_ops
    volumes:
      - mongo_data:/data/db
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7.2-alpine
    container_name: fleet_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fleet_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - API_PORT=3000
      - API_HOST=0.0.0.0
      - CORS_ORIGIN=http://localhost:5173
      - MONGO_URI=mongodb://mongo:27017/fleet_ops
      - MONGO_DATABASE=fleet_ops
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=info
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: fleet_worker
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - WORKER_HEALTH_PORT=3001
      - WORKER_CONCURRENCY=5
      - MONGO_URI=mongodb://mongo:27017/fleet_ops
      - MONGO_DATABASE=fleet_ops
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=info
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: fleet_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  fleet-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
